[package]
name = "hdradio"
description = "Pure-Rust NRSC-5 / HD Radio receiver"
readme = "readme.md"
keywords = ["sdr", "radio", "hd-radio", "nrsc-5"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "hdradio"
path = "src/main.rs"

[dependencies]
desperado = { version = "0.5.0", path = "../desperado", features = ["resampler"] }
clap = { version = "4.6", features = ["derive"] }
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pure-Rust AAC core with the HDC syntax adapter; standard ADTS AAC does not
# accept NRSC-5 HDC frames.
syom = { package = "hdradio-syom", version = "0.6.0-hdc.1", path = "../hdradio-syom" }
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
tinyaudio = "1.1"

[dev-dependencies]
approx = "0.5"
