[package]
name = "dabradio"
description = "A DAB/DAB+ digital radio decoder"
keywords = ["sdr", "radio", "dab", "ofdm", "digital-radio"]
readme = "readme.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "dabradio"
path = "src/lib.rs"

[[bin]]
name = "dabradio"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
# The decoder.
num-complex = "0.4"
rustfft = "6"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
oxideav-mp2 = "0.0.9"
reed-solomon = "0.2"

# DAB+ HE-AAC decoding through libfdk-aac. Off, the decoder still syncs,
# decodes the ensemble and the services, and hands over the DAB+ super-frames
# (Reed-Solomon corrected, Access Units extracted) for a caller that has its
# own AAC decoder; DAB (MP2) is pure Rust and always available.
fdk-aac = { version = "0.8", optional = true }

# The command-line receiver: a TUI over an SDR device or a file.
desperado = { version = "0.5.0", path = "../desperado", features = ["rtlsdr", "airspy", "hackrf", "resampler"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }
tinyaudio = { version = "0.1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
viuer = { version = "0.11.0", default-features = false, features = ["print-file"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = ["bin", "fdk-aac"]
# The command-line receiver's dependencies.
bin = [
    "dep:desperado",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:serde_json",
    "dep:tinyaudio",
    "dep:crossbeam-channel",
    "dep:tokio",
    "dep:futures",
    "dep:viuer",
    "dep:ratatui",
    "dep:crossterm",
]
# DAB+ HE-AAC audio (libfdk-aac). See the `fdk-aac` note above.
fdk-aac = ["dep:fdk-aac"]
soapy = ["desperado/soapy"]
